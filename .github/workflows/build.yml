name: Node.js CI

permissions:
  contents: write

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # TinaCMS commits MDX without Prettier; fix on main so format check passes.
      - name: Auto-format Tina content
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx prettier --write 'content/**'

      - name: Commit formatted content
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: format content [skip ci]'
          file_pattern: 'content/**'

      - name: Check Linting
        run: npm run lint

      - name: Check Format
        run: npm run format

      # Validate build only. Production deploys via Vercel Git integration (env vars
      # are available on Vercel's builders). Do not CLI-deploy prebuilt artifacts from
      # CI — GitHub runners lack production secrets and bake empty runtimeConfig.
      - name: Build
        env:
          # Nitro packaging of Nuxt Content + Tina admin exceeds default ~4GB heap on GHA
          NODE_OPTIONS: --max-old-space-size=8192
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          NUXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.NUXT_PUBLIC_TINA_CLIENT_ID }}
          TINA_BRANCH: main
        run: |
          if [ -n "$TINA_TOKEN" ] && [ -n "$NUXT_PUBLIC_TINA_CLIENT_ID" ]; then
            export TINA_BUILD_STRICT=1
            echo "Tina strict build enabled for CI"
          else
            echo "::warning::Tina secrets not configured — tinacms build will be skipped in CI"
          fi
          npm run build

  # After CI build succeeds, wait for Vercel Git integration to finish deploying
  # this commit to production. Requires VERCEL_TOKEN + VERCEL_PROJECT_ID secrets.
  wait-vercel:
    name: Wait for Vercel deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Wait until Vercel production deploy is READY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          SHA: ${{ github.sha }}
          MAX_ATTEMPTS: '60'
          SLEEP_SECONDS: '20'
        run: python3 scripts/wait-vercel-deploy.py
