name: Node.js CI

permissions:
  contents: write

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # TinaCMS commits MDX without Prettier; fix on main so format check passes.
      - name: Auto-format Tina content
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx prettier --write 'content/**'

      - name: Commit formatted content
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: format content [skip ci]'
          file_pattern: 'content/**'

      - name: Check Linting
        run: npm run lint

      - name: Check Format
        run: npm run format

      # One build only. On main with VERCEL_* secrets: pull prod env, build for Vercel
      # (.vercel/output), then deploy prebuilt. Otherwise: standard CI build.
      # Primary production deploys still come from Vercel Git integration on push to main.
      - name: Build
        env:
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          NUXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.NUXT_PUBLIC_TINA_CLIENT_ID }}
          TINA_BRANCH: main
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$TINA_TOKEN" ] && [ -n "$NUXT_PUBLIC_TINA_CLIENT_ID" ]; then
            export TINA_BUILD_STRICT=1
            echo "Tina strict build enabled for CI"
          else
            echo "::warning::Tina secrets not configured — tinacms build will be skipped in CI"
          fi

          cli_deploy=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
              cli_deploy=true
            else
              echo "Vercel CLI deploy skipped — missing VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID."
              echo "Production still deploys via Vercel Git integration on push to main."
            fi
          fi

          if [ "$cli_deploy" = true ]; then
            set +e
            npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
            pull_status=$?
            set -e
            if [ $pull_status -ne 0 ]; then
              echo "::warning::vercel pull failed (status $pull_status). Check VERCEL_ORG_ID and VERCEL_PROJECT_ID."
              echo "Falling back to standard CI build; production still deploys via Vercel Git integration."
              cli_deploy=false
            else
              export NITRO_PRESET=vercel
              echo "Building once for Vercel prebuilt deploy (NITRO_PRESET=vercel)"
            fi
          fi

          npm run build

          if [ "$cli_deploy" = true ]; then
            if [ ! -d ".vercel/output" ]; then
              echo "::warning::.vercel/output missing after build — skipping CLI deploy."
              exit 0
            fi
            set +e
            npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
            deploy_status=$?
            if [ $deploy_status -ne 0 ]; then
              echo "::warning::vercel deploy failed (status $deploy_status)."
              exit 0
            fi
            echo "Vercel CLI production deploy succeeded for ${{ github.sha }}"
          fi
